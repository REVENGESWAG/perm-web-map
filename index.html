<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Интерактивная карта Перми с измерением расстояний, площадей и координат.">
  <title>Пермь — веб-карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css?v=3">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js" crossorigin="anonymous"></script>
  <script type="module" src="./map.mjs?v=3"></script>
</head>
<body>
  <main class="workspace">
    <div class="map-frame">
      <div id="map" role="region" aria-label="Интерактивная карта Перми"></div>
      <p id="map-notice" class="map-notice" role="status">Загрузка карты…</p>
      <noscript><p class="map-notice">Для работы карты включите JavaScript.</p></noscript>
    </div>

    <header class="dock">
      <div class="title-group">
        <span class="brand-mark" aria-hidden="true">⌖</span>
        <h1>Карта Перми</h1>
      </div>
      <nav class="dock-tools" aria-label="Инструменты карты">
        <button type="button" data-panel="layers" aria-expanded="false" aria-controls="drawer">Слои</button>
        <button type="button" data-panel="measure" aria-expanded="false" aria-controls="drawer">Измерить</button>
        <button type="button" id="mark" aria-pressed="false">Метка</button>
        <button type="button" data-panel="share" aria-expanded="false" aria-controls="drawer">Поделиться</button>
      </nav>
    </header>

    <aside id="drawer" class="drawer" aria-labelledby="drawer-heading" hidden>
      <div class="drawer-heading">
        <h2 id="drawer-heading"></h2>
        <button id="close-panel" class="icon-button" type="button" aria-label="Закрыть панель" title="Закрыть панель">×</button>
      </div>
      <section id="measure-panel" hidden>
        <div class="tools" role="group" aria-label="Режим измерения">
          <button type="button" data-mode="length" aria-pressed="false">Длина</button>
          <button type="button" data-mode="area" aria-pressed="false">Площадь</button>
          <button type="button" data-mode="coordinate" aria-pressed="false">Координаты</button>
        </div>
        <div class="readout">
          <p id="hint">Выберите инструмент и укажите точки на карте.</p>
          <output id="result" aria-live="polite" hidden></output>
          <button id="copy" class="text-button" type="button" hidden>Скопировать координаты</button>
          <span id="copy-status" role="status"></span>
        </div>
        <div class="actions">
          <button id="finish" type="button" class="primary" hidden>Завершить</button>
          <button id="undo" type="button" hidden>Убрать точку</button>
          <button id="clear" type="button" hidden>Очистить</button>
        </div>
      </section>
      <section id="layers-panel" hidden>
        <fieldset>
          <legend>Подложка</legend>
          <label class="layer"><input type="radio" name="basemap" value="osm" checked> <span>OpenStreetMap</span></label>
          <label class="layer"><input type="radio" name="basemap" value="imagery"> <span>Спутник Esri</span></label>
        </fieldset>
        <fieldset>
          <legend>Дополнительные слои</legend>
          <label class="layer"><input id="home-extent" type="checkbox"> <span>Границы начального вида</span></label>
          <label class="layer"><input id="measurements" type="checkbox" checked> <span>Результат измерения</span></label>
        </fieldset>
      </section>
      <section id="share-panel" hidden>
        <label for="share-url">Ссылка на текущий вид и метку</label>
        <input id="share-url" type="url" readonly>
        <button id="copy-link" class="primary" type="button">Скопировать ссылку</button>
        <p id="share-status" class="feedback" role="status"></p>
      </section>
    </aside>

    <div class="map-actions" role="group" aria-label="Навигация по карте">
      <button type="button" id="zoom-in" class="icon-button" aria-label="Приблизить" title="Приблизить">+</button>
      <button type="button" id="zoom-out" class="icon-button" aria-label="Отдалить" title="Отдалить">−</button>
      <button type="button" id="home" class="icon-button" aria-label="Домой" title="Домой · начальный вид Перми">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M10 20v-6h4v6"/></svg>
      </button>
      <button type="button" id="locate" class="icon-button" aria-label="Моё местоположение" title="Моё местоположение">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/></svg>
      </button>
    </div>
    <p id="map-feedback" class="map-feedback" role="status" hidden></p>
  </main>
</body>
</html>
